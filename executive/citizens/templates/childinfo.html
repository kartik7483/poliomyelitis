<!DOCTYPE html>
<html>
{% load static %}
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Child Information</title>
	<style type="text/css">
		body {
			background-image: url("{% static 'p4.jpg' %}");
			background-size: 100% 100%;
			background-attachment: fixed;
			background-color: #000;
		}

		.nav {
		    display: flex;
		    justify-content: flex-end;
		}

		.nav a {
	      padding: 1px 15px;
	      text-decoration: none;
	      color: navy;
	      font-weight: 600;
	      font-size: 16px;
	    }

	    a:hover {
	          text-decoration: underline;
	      }

		.box {
            display: flex;
            width: 300px;
            border: 2px solid black;
            background-color: mintcream;
            flex-direction: column;
            color: black;
            font-size: 18px;
            margin-top: 0px;
            margin-left:30px;
            align-items: center;
            border-radius: 20px;
            box-shadow: 2px 3px 10px rgba(0, 0, 0, 0.5);
            padding: 5px;
    	}

		.tb {
		    width: 80%;
		    padding: 10px;
		    margin: 10px 0;
		    border-radius: 5px;
		    border: 1px solid #ccc;
		    transition: border-color 0.3s;
		}

		.tb:focus {
		    border-color: dodgerblue;
		    outline: none;
		}

		#btn {
		    background-color: dodgerblue;
		    color: white;
		    padding: 10px;
		    margin: 10px 0;
		    width: 60%;
		    border-radius: 10px;
		    border: none;
		    cursor: pointer;
		    transition: background-color 0.3s, transform 0.3s;
		}

		#btn:hover {
		    background-color: black;
		    transform: scale(1.05);
		}

		a {
		    color: dodgerblue;
		    margin: 10px;
		    text-decoration: none;
		}
	</style>
</head>
<body>
	<div class="nav">
    		<a href="{% url 'showcitizenshome' %}">BACK</a>

    </div>

    <form class="box" method="POST">
		{% csrf_token %}
    	<h2>CHILD INFORMATION</h2>

    	<input type="text" name="t1" class="tb" value="{{pid}}" readonly>

        <input type="text" name="t2" class="tb" placeholder="Enter Name"
        	required pattern="[A-Za-z\s]{2,50}"
        	title="Name should only contain letters and spaces (2-50 characters)">

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="t3" max="2025-06-18" required>

        <input type="tel" name="t4" class="tb" placeholder="Enter Parent Contact"
        	required pattern="[6-9]{1}[0-9]{9}"
        	title="Enter a valid 10-digit phone number starting with 6-9">

        <input type="text" name="t5" class="tb" placeholder="Enter Location"
        	required maxlength="100"
        	title="Enter a location (max 100 characters)">

		 <select name="t6" class="tb" required>
    <option value="" disabled selected>Select Child Status</option>
    <option value="New Born">New Born</option>
    <option value="Infant">Infant</option>
    <option value="Eligible">Eligible</option>
    <option value="Partially Vaccinated">Partially Vaccinated</option>
    <option value="Fully Vaccinated">Fully Vaccinated</option>
  </select>

    	<input type="submit" name="sub" id="btn" value="Submit">
    </form>
</body>
</html>
