<!DOCTYPE html>
<html>
{%load static %}
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title> </title>
		<style type="text/css">
			body {
					background-image: url("{% static 'p4.jpg' %}");
					background-size: 100% 100%;
					background-attachment: fixed;
					background-color: #000; /* Fallback color */
				}

			.nav {
			    display: flex;
			    justify-content: flex-end; /* Aligns the navigation to the right */
			}

			.nav a {
		      padding: 1px 15px;
		      text-decoration: none;
		      color: navy;
		      font-weight: 600;
		      font-size: 16px;
		    }

		    a:hover {
		          text-decoration: underline; /* Underline on hover */
		      }

			.box {
	            display: flex;
	            width: 350px;
	            border: 2px solid black;
	            background-color: mintcream; /*(transparent;) ( rgba(255, 255, 255, 0.9)) Semi-transparent white background */
	            flex-direction: column;
	            color: black; /* Change text color for better contrast */
	            font-size: 18px; /* Decreased font size for the box */
	            /*margin: auto;*/
	            margin-top: 0px;
	            margin-left:30px;
	            align-items: center;
	            border-radius: 20px;
	            box-shadow: 2px 3px 10px rgba(0, 0, 0, 0.5); /* Shadow for the box */
	            padding: 5px; /* Padding inside the box */
        	}

			.tb {
			    width: 80%; /* Increased width for better usability */
			    padding: 10px; /* Increased padding for comfort */
			    margin: 10px 0; /* Vertical margin for spacing */
			    border-radius: 5px;
			    border: 1px solid #ccc; /* Light border */
			    transition: border-color 0.3s; /* Transition for border color */
			}

			.tb:focus {
			    border-color: dodgerblue; /* Change border color on focus */
			    outline: none; /* Remove default outline */
			}

			#anc,button {
			    background-color: dodgerblue;
			    color: white; /* Text color for the button */
			    padding: 10px; /* Increased padding */
			    margin: 10px 0; /* Vertical margin for spacing */
			    width: 60%; /* Adjusted width */
			    border-radius: 10px;
			    border: none; /* Remove border */
			    cursor: pointer; /* Pointer cursor on hover */
			    transition: background-color 0.3s, transform 0.3s; /* Transition for hover effect */
			}

			#anc:hover,button:hover {
			    background-color: black; /* Change background color on hover */
			    transform: scale(1.05); /* Slightly enlarge on hover */
			}

			a {
			    color: dodgerblue; /* Change link color */
			    margin: 10px;
			    text-decoration: none; /* Remove underline */
			}

		</style>
</head>
<body>
	<div class="nav">
        	<a href="{% url 'showindex' %}">BACK</a>

    </div>

    <form class="box" method="POST" action="" >
  {% csrf_token %}
  <h2>CITIZENS</h2>
  NOTE: <h6>Your Registered Email Will Be As UserName For Login</h6>

  <input type="text" name="t1" class="tb" required value="{{ pid }}" readonly>
  <input type="text" name="t2" class="tb" placeholder="Enter Name" pattern="[A-Za-z\s]+" title="Enter alphabets only" required>
  <input type="text" name="t3" class="tb" placeholder="Enter Address">
    <input type="text" name="t4" class="tb" placeholder="Enter Mobile Number" pattern="[6-9]\d{9}"
       oninvalid="this.setCustomValidity('Please enter a valid 10-digit number starting with 6, 7, 8, or 9')"
       oninput="this.setCustomValidity('')"
       required>

  <input type="text" name="t5" class="tb" placeholder="Enter City">
  <input type="email" name="t6" class="tb" placeholder="Enter Email" required title="Please enter a valid email address">
  <input type="text" name="t7" class="tb" placeholder="Enter Password" required pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}" title="Min 8 chars with uppercase, lowercase, number & special character">

 <button type="submit" class="tb"  >Submit</button>
</form>
</body>
</html>
