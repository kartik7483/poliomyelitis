<!DOCTYPE html>
<html>
{%load static %}
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dose Details</title>
		<style type="text/css">
			body {
					background-image: url("{% static 'p4.jpg' %}");
					background-size: 100% 100%;
					background-attachment: fixed;
					background-color: #000; /* Fallback color */
				}

			.nav {
			    display: flex;
			    justify-content: flex-end; /* Aligns the navigation to the right */
			}

			.nav a {
		      padding: 1px 15px;
		      text-decoration: none;
		      color: navy;
		      font-weight: 600;
		      font-size: 16px;
		    }

		    a:hover {
		          text-decoration: underline; /* Underline on hover */
		      }

			.box {
	            display: flex;
	            width: 300px;
	            border: 2px solid black;
	            background-color: mintcream;
	            flex-direction: column;
	            color: black;
	            font-size: 18px;
	            margin-top: 0px;
	            margin-left:30px;
	            align-items: center;
	            border-radius: 20px;
	            box-shadow: 2px 3px 10px rgba(0, 0, 0, 0.5);
	            padding: 5px;
        	}

			.tb {
			    width: 80%;
			    padding: 10px;
			    margin: 10px 0;
			    border-radius: 5px;
			    border: 1px solid #ccc;
			    transition: border-color 0.3s;
			}

			.tb:focus {
			    border-color: dodgerblue;
			    outline: none;
			}

			#btn {
			    background-color: dodgerblue;
			    color: white;
			    padding: 10px;
			    margin: 10px 0;
			    width: 60%;
			    border-radius: 10px;
			    border: none;
			    cursor: pointer;
			    transition: background-color 0.3s, transform 0.3s;
			}

			#btn:hover {
			    background-color: black;
			    transform: scale(1.05);
			}

			a {
			    color: dodgerblue;
			    margin: 10px;
			    text-decoration: none;
			}
		</style>
</head>
<body>
	<div class="nav">
        	<a href="{% url 'showworkerhome' %}">BACK</a>
        	
    </div>

    <form class="box" method="POST">
			{% csrf_token %}
        	<h2>DOSE DETAILS</h2>
        	<input type="text" name="t1" class="tb" required value="{{ pid }}" readonly>
            <input type="text" name="t2" class="tb" placeholder="Enter Citizen ID" required>
            <input type="text" name="t3" class="tb" placeholder="Enter Vaccine Name" required>
            <input type="text" name="t4" class="tb" placeholder="Enter Dose Number" required>
            <input type="date" name="t5" class="tb" min="{{ today_date }}" required>
            <input type="text" name="t6" class="tb" value="{{uname}}" readonly>
        	<input type="submit" name="sub" id="btn" value="Submit">
    </form>
</body>
</html>
